[project]
name = "api"
version = "0.1.0"
description = "Sikto FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.48.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "alembic>=1.14.0",
    "httpx>=0.28.1",
    "crawl4ai>=0.4.0",
    "youtube-transcript-api>=1.1",
    "pgvector>=0.3.6",
    "markitdown[pdf]>=0.0.1a3",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "sqlmodel>=0.0.22",
    "typer>=0.15.0",
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.10",
    "langchain-core>=0.3.20",
    "ddgs>=6.0",
    "pillow>=11.0",
    "loguru>=0.7.2",
]

[project.scripts]
sikto = "api.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "typer.Option",
    "typer.Argument",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg", "crawl4ai", "youtube_transcript_api"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
