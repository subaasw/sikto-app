[project]
name = "tts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
    "fastapi[standard]>=0.136.3",
    "mutagen>=1.47.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
